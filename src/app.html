<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Studently — Your semester, under control</title>
		<meta
			name="description"
			content="Studently turns your deadlines into a calm daily plan. Smart scheduling, a focus timer that tracks progress, and tasks that sync everywhere."
		/>
		<meta name="theme-color" content="#0d0c14" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
		<meta property="og:title" content="Studently — Your semester, under control" />
		<meta
			property="og:description"
			content="Smart scheduling, focus sessions and tasks for students."
		/>
		<meta property="og:type" content="website" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply theme + accent before first paint so there is no flash.
			(function () {
				try {
					var s = JSON.parse(localStorage.getItem('studently:settings') || '{}');
					var t = s.theme;
					if (!t) {
						var old = localStorage.getItem('theme');
						t = old ? JSON.parse(old) : 'system';
					}
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					var hues = {
						blue: [258, 232], iris: [285, 318], sky: [228, 200], ocean: [228, 200],
						mint: [165, 190], lime: [165, 190], gold: [80, 55], ember: [40, 18], rose: [355, 15]
					};
					var hue = hues[s.accent] || hues.blue;
					var root = document.documentElement;
					root.dataset.theme = t;
					root.style.setProperty('--accent-h', hue[0]);
					root.style.setProperty('--accent-h2', hue[1]);
					// Last accent-colored favicon, so the tab icon is right before the app loads.
					var icon = localStorage.getItem('studently:favicon');
					var link = document.querySelector('link[rel="icon"]');
					if (icon && link) link.href = icon;
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		<style>
			#splash {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: oklch(0.155 0.014 var(--accent-h, 258));
				z-index: 9999;
				transition: opacity 0.5s ease, visibility 0.5s;
			}
			[data-theme='light'] #splash {
				background: oklch(0.975 0.006 var(--accent-h, 258));
			}
			#splash.hide {
				opacity: 0;
				visibility: hidden;
			}
			#splash svg {
				width: 56px;
				height: 56px;
				animation: splash-pulse 1.6s ease-in-out infinite;
				filter: drop-shadow(0 10px 30px oklch(0.65 0.2 var(--accent-h, 258) / 0.5));
			}
			@keyframes splash-pulse {
				0%, 100% { transform: scale(0.94); opacity: 0.75; }
				50% { transform: scale(1.02); opacity: 1; }
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" aria-hidden="true">
			<svg viewBox="0 0 48 48">
				<defs>
					<linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0" style="stop-color: oklch(0.6 0.2 var(--accent-h, 258))" />
						<stop offset="1" style="stop-color: oklch(0.6 0.18 var(--accent-h2, 232))" />
					</linearGradient>
				</defs>
				<rect width="48" height="48" rx="12" fill="url(#sg)" />
				<path d="M24 10 42.5 18.4 24 26.8 5.5 18.4Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" /><path d="M13.8 24.8 24 29.4 34.2 24.8V30.6C34.2 33.6 29.6 36 24 36S13.8 33.6 13.8 30.6Z" fill="#fff" fill-opacity=".74" /><path d="M39.6 20.4V30.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" /><circle cx="39.6" cy="31.6" r="2.3" fill="#fff" />
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
